[project]
name = "flight-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Artur",email = "my_email@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.flake8]
max-line-length = 119
exclude = [".venv", "__pycache__", ".git"]
